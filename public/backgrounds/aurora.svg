<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b1c"/>
      <stop offset="0.45" stop-color="#101b3c"/>
      <stop offset="0.78" stop-color="#1b2350"/>
      <stop offset="1" stop-color="#0a0d20"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="0.28" cy="0.32" r="0.52">
      <stop offset="0" stop-color="#39e0c8" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#1f8fb5" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#1f8fb5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.76" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#a86bff" stop-opacity="0.40"/>
      <stop offset="0.55" stop-color="#6a3cc0" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#6a3cc0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ff0d0" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#6ff0d0" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2c6bd8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64d8ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#64d8ff" stop-opacity="0.16"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.48" r="0.78">
      <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.62"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="450" cy="290" rx="620" ry="360" fill="url(#glowTeal)"/>
  <ellipse cx="1210" cy="255" rx="640" ry="380" fill="url(#glowViolet)"/>

  <g filter="url(#soft)" opacity="0.85">
    <path d="M-120 250 C 260 90, 520 420, 880 230 S 1420 120, 1740 300 L 1740 470 C 1360 320, 1040 590, 700 400 S 220 330, -120 470 Z" fill="url(#ribbon)"/>
    <path d="M-100 370 C 300 250, 560 520, 940 330 S 1460 260, 1720 400 L 1720 520 C 1400 400, 1080 640, 720 470 S 260 430, -100 540 Z" fill="#8a6bff" opacity="0.16"/>
  </g>

  <rect y="620" width="1600" height="280" fill="url(#horizon)"/>
  <g fill="#dff6ff" opacity="0.7">
    <circle cx="140" cy="120" r="1.5"/><circle cx="330" cy="78" r="1.2"/>
    <circle cx="610" cy="140" r="1.6"/><circle cx="880" cy="66" r="1.1"/>
    <circle cx="1120" cy="118" r="1.5"/><circle cx="1390" cy="92" r="1.3"/>
    <circle cx="1520" cy="190" r="1.1"/><circle cx="240" cy="230" r="1.1"/>
    <circle cx="760" cy="200" r="1.0"/><circle cx="1280" cy="230" r="1.2"/>
  </g>
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
