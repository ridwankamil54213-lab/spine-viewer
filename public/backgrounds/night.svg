<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04060f"/>
      <stop offset="0.55" stop-color="#0a1030"/>
      <stop offset="1" stop-color="#131a3c"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.76" cy="0.20" r="0.42">
      <stop offset="0" stop-color="#cfe4ff" stop-opacity="0.42"/>
      <stop offset="0.35" stop-color="#7da4ff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7da4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.75" stop-color="#e6edff"/>
      <stop offset="1" stop-color="#c3d2f5"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b5da8" stop-opacity="0"/>
      <stop offset="1" stop-color="#3b5da8" stop-opacity="0.20"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0.4" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.66"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="1220" cy="180" rx="560" ry="440" fill="url(#moonGlow)"/>
  <circle cx="1220" cy="178" r="66" fill="url(#moon)" opacity="0.92"/>
  <circle cx="1220" cy="178" r="90" fill="#cfe4ff" opacity="0.10" filter="url(#soft)"/>

  <g fill="#eaf2ff">
    <circle cx="90" cy="96" r="1.6" opacity="0.8"/><circle cx="214" cy="182" r="1.1" opacity="0.6"/>
    <circle cx="368" cy="74" r="1.8" opacity="0.9"/><circle cx="492" cy="230" r="1.2" opacity="0.5"/>
    <circle cx="620" cy="122" r="1.5" opacity="0.8"/><circle cx="742" cy="58" r="1.0" opacity="0.6"/>
    <circle cx="858" cy="196" r="1.7" opacity="0.9"/><circle cx="980" cy="104" r="1.2" opacity="0.5"/>
    <circle cx="1090" cy="262" r="1.4" opacity="0.7"/><circle cx="1380" cy="88" r="1.6" opacity="0.8"/>
    <circle cx="1490" cy="220" r="1.1" opacity="0.6"/><circle cx="1540" cy="130" r="1.3" opacity="0.7"/>
    <circle cx="300" cy="320" r="1.0" opacity="0.5"/><circle cx="540" cy="300" r="1.2" opacity="0.6"/>
    <circle cx="760" cy="350" r="1.1" opacity="0.5"/><circle cx="1320" cy="330" r="1.0" opacity="0.5"/>
  </g>

  <rect y="560" width="1600" height="340" fill="url(#haze)"/>
  <path d="M0 760 L180 660 L320 720 L470 610 L640 730 L820 640 L1000 740 L1180 650 L1360 730 L1520 670 L1600 720 L1600 900 L0 900 Z"
        fill="#080c20" opacity="0.85"/>
  <path d="M0 810 L220 740 L430 800 L660 720 L900 810 L1140 750 L1380 810 L1600 760 L1600 900 L0 900 Z"
        fill="#050814" opacity="0.9"/>
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
